name: Deploy to DomaiNesia FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install JS dependencies & Build Assets
      run: |
        npm ci
        npm run build

    - name: 📂 Sync Laravel Core Files to /biconnect
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /biconnect/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/public/**
          **/tests/**
          biconnect.sql
          biconnect.zip
          clean_sql.php
          database.dbml
          dbml-error.log

    - name: 📂 Sync Public Files to /public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/
        server-dir: /public_html/
        exclude: |
          **/.git*
          **/.git*/**
          index.php
